name: Update Rumors Feed

on:
  schedule:
    - cron: '0 */4 * * *'  # Run every 4 hours
  workflow_dispatch:  # Allow manual trigger

jobs:
  update-feed:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pnpm comes from the packageManager field in package.json. pnpm 12 needs a
      # newer corepack than the one bundled with Node.
      - name: Enable corepack
        run: npm install -g corepack@latest && corepack enable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The start script sets TZ=UTC and writes rumors.json / rumors.xml.
      - name: Generate feed
        run: pnpm start

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update rumors feed"
          file_pattern: 'rumors.json rumors.xml'
          commit_author: GitHub Actions <actions@github.com>
